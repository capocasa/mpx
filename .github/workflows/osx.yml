name: macOS

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore Nim toolchain cache
        id: cache-nim
        uses: actions/cache@v4
        with:
          path: /Users/runner/nim-toolchain
          # Key includes the pinned nim-version: a hit must never resurrect
          # a toolchain older/newer than the nim-version input above.
          key: ${{ runner.os }}-${{ runner.arch }}-nim-toolchain-2.2.12-${{ hashFiles('mpx.nimble') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nim-toolchain-

      - uses: jiro4989/setup-nim-action@v2
        if: steps.cache-nim.outputs.cache-hit != 'true'
        with:
          nim-version: 2.2.12
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          parent-nim-install-directory: $HOME
          nim-install-directory: nim-toolchain

      - name: Add Nim to PATH on cache hit
        if: steps.cache-nim.outputs.cache-hit == 'true'
        run: echo "$HOME/nim-toolchain/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Generate nimble.paths for direct nim invocations
        # The committed nimble.lock disables nim's pkgs2 package scan, so
        # the raw `nim c` build steps get no dependency paths. nimble.paths
        # (gitignored, included by config.nims) restores them.
        run: |
          { echo '--noNimblePath'
            for d in "$HOME"/.nimble/pkgs2/*/; do echo "--path:\"$d\""; done
          } > nimble.paths
          cat nimble.paths

      - name: Build
        # macos-latest is arm64; the amd64 slice is cross-compiled on the
        # same machine with clang -arch x86_64, then lipo merges both into
        # one universal binary.
        run: |
          nim c --hints:off --path:src -d:release -o:mpx src/mpx.nim
          nim c --hints:off --path:src -d:release --cpu:amd64 --os:macosx \
            --passC:-arch --passC:x86_64 --passL:-arch --passL:x86_64 \
            -o:mpx-amd64 src/mpx.nim

      - name: Test
        run: nimble test

      - name: Example
        run: nimble example
        timeout-minutes: 8

      - name: Package universal
        run: |
          lipo -create mpx mpx-amd64 -output mpx-universal
          mkdir -p mpx-macos-universal
          cp mpx-universal mpx-macos-universal/mpx
          ./mpx -v > mpx-macos-universal/VERSION
          cp README.md mpx-macos-universal/
          tar czf mpx-macos-universal.tar.gz mpx-macos-universal

      - name: Upload artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: mpx-macos-universal
          path: mpx-macos-universal.tar.gz

      - name: Upload artifact to mpx.capocasa.dev
        if: github.ref == 'refs/heads/main'
        run: |
          curl -f -H "Authorization: Bearer ${{ secrets.RELEASE_SECRET }}" -F "file=@mpx-macos-universal.tar.gz" \
            https://mpx.capocasa.dev/main/builds/upload.nim
